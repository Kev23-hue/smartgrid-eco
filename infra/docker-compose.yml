# Log de eventos de la nube (ADR-003/004), reducido a un solo nodo para el prototipo.
# En producción serían 3 brokers; aquí no se mide la replicación, solo el comportamiento del reenviador.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: sge-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk -X brokers=redpanda:9092 topic create telemetry.raw -p 24 -r 1 || true
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: sge-timescaledb
    environment:
      POSTGRES_USER: sge
      POSTGRES_PASSWORD: sge
      POSTGRES_DB: sge
    ports:
      - "5433:5432"
    # Archivos sueltos (no la carpeta entera) para no tapar los scripts de inicio de la propia imagen.
    # Solo se ejecutan la primera vez, con el volumen vacío. Para rehacer: docker compose down -v
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    volumes:
      - ../cloud/sql/01_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ../cloud/sql/02_timescale.sql:/docker-entrypoint-initdb.d/020_timescale.sql:ro
      - sge-pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sge -d sge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  sge-pgdata:
